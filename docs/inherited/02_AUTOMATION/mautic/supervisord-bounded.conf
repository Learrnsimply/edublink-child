; Mautic worker supervisord — BOUNDED version
; Adds --memory-limit/--time-limit/--limit flags to prevent OOM during 13K broadcast
; Per Deep Research finding #1 (2026-06-01) — vanilla unbounded workers leak memory over hour-long broadcasts
;
; Differences from default Mautic Docker supervisord.conf:
;  - email consumer: --memory-limit=128M --time-limit=160 --limit=60 (recycle every 60 msgs or 160s)
;  - hit  consumer:  --memory-limit=128M --time-limit=300 --limit=200
;  - failed consumer: --memory-limit=64M  --time-limit=600 --limit=50
;
; Behavior: when --memory-limit OR --time-limit OR --limit is reached, the worker exits gracefully
; and supervisord restarts it with a fresh PHP process. Net effect: bounded RAM, no OOM.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
user=root

[program:messenger-consume-email]
command=php /var/www/html/bin/console messenger:consume email --memory-limit=128M --time-limit=160 --limit=60 --no-interaction
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-hit]
command=php /var/www/html/bin/console messenger:consume hit --memory-limit=128M --time-limit=300 --limit=200 --no-interaction
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_HIT)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:messenger-consume-failed]
command=php /var/www/html/bin/console messenger:consume failed --memory-limit=64M --time-limit=600 --limit=50 --no-interaction
user=www-data
numprocs=%(ENV_DOCKER_MAUTIC_WORKERS_CONSUME_FAILED)s
startsecs=0
autostart=true
autorestart=true
startretries=10
process_name=%(program_name)s_%(process_num)02d
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
