services:
  mautic:
    image: mautic/mautic:latest
    restart: unless-stopped
    environment:
      MAUTIC_DB_HOST: db
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${MYSQL_PASSWORD}
      MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
      MAUTIC_MESSENGER_DSN_HIT: doctrine://default
      DOCKER_MAUTIC_RUN_MIGRATIONS: "1"
      # Restrict trusted proxies to Docker bridge CIDR (covers 172.16.0.0/24 + 172.16.1.0/24 the mautic_default bridge)
      # Defense in depth: local.php also has trusted_proxies => ['REMOTE_ADDR']
      TRUSTED_PROXIES: '172.16.0.0/16'
      # Block host header injection — allow production hostname + localhost (healthcheck needs localhost)
      MAUTIC_TRUSTED_HOSTS_PATTERNS: '^(mautic\.learrnsimply\.com|localhost|127\.0\.0\.1)$'
    healthcheck:
      test:
        - CMD
        - curl
        - -f
        - http://localhost
      start_period: 60s
      interval: 15s
      timeout: 5s
      retries: 20
    volumes:
      - mautic-config:/var/www/html/config
      - mautic-logs:/var/www/html/var/logs
      - mautic-media-files:/var/www/html/docroot/media/files
      - mautic-media-images:/var/www/html/docroot/media/images
    ports:
      - "80"
    labels:
      - traefik.enable=true
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${PUBLIC_HOSTNAME}`)
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure
      - traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=letsencrypt
      - traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=80
    depends_on:
      db:
        condition: service_healthy

  mautic-cron:
    image: mautic/mautic:latest
    restart: unless-stopped
    environment:
      MAUTIC_DB_HOST: db
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${MYSQL_PASSWORD}
      MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
      MAUTIC_MESSENGER_DSN_HIT: doctrine://default
      DOCKER_MAUTIC_ROLE: mautic_cron
    volumes:
      - mautic-config:/var/www/html/config
      - mautic-logs:/var/www/html/var/logs
      - mautic-media-files:/var/www/html/docroot/media/files
      - mautic-media-images:/var/www/html/docroot/media/images
    depends_on:
      mautic:
        condition: service_healthy

  mautic-worker:
    image: mautic/mautic:latest
    restart: unless-stopped
    environment:
      MAUTIC_DB_HOST: db
      MAUTIC_DB_DATABASE: mautic
      MAUTIC_DB_USER: mautic
      MAUTIC_DB_PASSWORD: ${MYSQL_PASSWORD}
      MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
      MAUTIC_MESSENGER_DSN_HIT: doctrine://default
      DOCKER_MAUTIC_ROLE: mautic_worker
    volumes:
      - mautic-config:/var/www/html/config
      - mautic-logs:/var/www/html/var/logs
      - mautic-media-files:/var/www/html/docroot/media/files
      - mautic-media-images:/var/www/html/docroot/media/images
      - /docker/mautic-r4bx/supervisord-bounded.conf:/etc/supervisor/conf.d/supervisord.conf:ro
    depends_on:
      mautic:
        condition: service_healthy

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: mautic
      MYSQL_USER: mautic
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - mysql-data:/var/lib/mysql

volumes:
  mautic-config:
  mautic-logs:
  mautic-media-files:
  mautic-media-images:
  mysql-data:
